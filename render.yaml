# Blueprint do Render — deploy de demonstração.
#
# Descreve os três recursos da aplicação: o Postgres, a API e o frontend. É
# versionado para que a infraestrutura da demonstração seja revisável como o
# resto do projeto, e para que a publicação não dependa de cliques lembrados de
# memória.
#
# O deploy é um diferencial opcional do enunciado, que declara explicitamente
# não ser necessário publicar. Os passos e as ressalvas estão no README, seção
# "Deploy de demonstração".

databases:
  - name: ideas-hub-db
    plan: free
    postgresMajorVersion: "16"
    # O schema exige pg_trgm, criada pela migration 0000. O Postgres gerenciado
    # do Render permite a extensão; a migration falha em voz alta se não
    # permitisse, em vez de degradar a busca em silêncio.

services:
  - type: web
    name: ideas-hub-api
    runtime: node
    plan: free
    rootDir: apps/api
    # `--include=dev` é obrigatório aqui, não zelo: `NODE_ENV=production` abaixo
    # faz o npm assumir `omit=dev`, e o build precisa do TypeScript e dos
    # `@types` para compilar. Sem a opção, o deploy falha com
    # `TS7016: Could not find a declaration file for module 'pg-copy-streams'`
    # — medido: 99 pacotes instalados contra os 454 necessários.
    buildCommand: npm ci --include=dev && npm run build
    # As migrations rodam na inicialização, e não como `preDeployCommand`, que o
    # Render recusa no plano gratuito: "pre-deploy command is not supported for
    # free tier services". O encadeamento com `&&` é o que garante que o
    # servidor não sobe com o schema desatualizado.
    #
    # Rodar a cada início é seguro porque o migrador do Drizzle registra o que
    # já aplicou e ignora o resto — e no plano gratuito, que hiberna, isso
    # acontece com frequência. O custo é alguns segundos no primeiro acesso.
    #
    # Usa o pacote compilado, e não `tsx`, que é dependência de desenvolvimento
    # e não existe aqui — foi por isso que o build passou a copiar os .sql para
    # dist/.
    startCommand: npm run db:migrate:dist && npm start
    healthCheckPath: /health
    envVars:
      # Precisa vir do ambiente, nunca de arquivo .env: o mesmo arquivo é lido
      # pelo Vite, e um NODE_ENV escrito para a API faria o frontend publicar o
      # React de desenvolvimento.
      - key: NODE_ENV
        value: production
      # A plataforma usa Node 24 por padrão; o projeto é desenvolvido e testado
      # no 22. Fixar evita que uma troca de padrão do Render mude o ambiente de
      # execução sem ninguém pedir.
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: ideas-hub-db
          property: connectionString
      # Preenchidas no painel, não aqui:
      #  - WEATHER_API_KEY é segredo e não entra em arquivo versionado;
      #  - CORS_ORIGIN é a URL do frontend, que só existe depois do primeiro
      #    deploy dele. A ordem está documentada no README.
      - key: WEATHER_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: ideas-hub-web
    runtime: static
    rootDir: apps/web
    # Mesma razão da API: o build depende de Vite e TypeScript, que são
    # dependências de desenvolvimento. Aqui `NODE_ENV` não está definida hoje,
    # mas a opção deixa o comando correto independentemente disso.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      # Embutida no pacote em tempo de build, não lida em execução — trocar de
      # valor exige reconstruir o frontend, e é isso que cria a ordem de deploy
      # descrita no README.
      - key: VITE_API_URL
        sync: false
    routes:
      # Aplicação de página única: qualquer caminho serve o index.html, senão
      # abrir /users direto ou recarregar a página devolve 404 — e manter os
      # filtros na URL é um requisito do enunciado.
      - type: rewrite
        source: /*
        destination: /index.html
