# Verifica e publica.
#
# A publicação usa o Deploy Hook de cada serviço do Render, e não o deploy
# automático da plataforma, por dois motivos.
#
# O primeiro é circunstancial: o blueprint foi criado a partir da URL do
# repositório público, e instalar o app do Render no GitHub depois não religa um
# recurso já existente — um push real não disparou nada. Recriar o blueprint
# resolveria, ao custo de mudar as URLs já publicadas.
#
# O segundo é o que faz este caminho ser melhor, e não apenas um contorno: o
# deploy automático do Render publica a cada push, passando ou não nos testes.
# Aqui a publicação depende da verificação.

name: Verificação e publicação

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um push novo cancela a execução anterior da mesma referência: publicar uma
# versão que já foi superada é desperdício, e confunde quem lê o histórico.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # A mesma versão usada no desenvolvimento e fixada no render.yaml.
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # Os testes de integração sobem um PostgreSQL efêmero por Testcontainers,
      # que depende do Docker presente no runner. É de propósito: as regras que
      # importam aqui — unicidade sem distinção de caixa, deduplicação da
      # importação, uso dos índices — são comportamento do banco, e simulá-las
      # testaria apenas o simulador.
      - name: Testes com cobertura
        run: npm run test:coverage

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - name: Testes com cobertura
        run: npm run test:coverage

      # O build entra na verificação porque ele carrega uma guarda própria: o
      # `check-build.mjs` recusa um pacote que traga o React de desenvolvimento,
      # defeito que já chegou a ser publicado uma vez e que não se manifesta
      # como erro — só como 920 KB em vez de 672 KB.
      - name: Build de produção
        run: npm run build

  publicar:
    name: Publicar no Render
    needs: [api, web]
    # Só em push na main. Pull request roda a verificação e para aí: publicar a
    # partir de um PR colocaria código não revisado no ar.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Sem esta checagem, um segredo ausente faria o `curl` receber uma URL
      # vazia e o job passar em verde sem publicar nada — falha silenciosa, que
      # é o pior desfecho possível para um passo de publicação.
      - name: Conferir que os segredos existem
        env:
          HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          faltando=""
          [ -n "$HOOK_API" ] || faltando="$faltando RENDER_DEPLOY_HOOK_API"
          [ -n "$HOOK_WEB" ] || faltando="$faltando RENDER_DEPLOY_HOOK_WEB"
          if [ -n "$faltando" ]; then
            echo "Segredo(s) ausente(s):$faltando"
            echo "Cadastre em Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Publicar a API
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        # `-f` faz o curl falhar em resposta de erro; sem ele, um hook revogado
        # devolveria 401 e o passo passaria assim mesmo.
        run: curl -fsS -X POST "$HOOK" > /dev/null && echo "deploy da API disparado"

      - name: Publicar o frontend
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: curl -fsS -X POST "$HOOK" > /dev/null && echo "deploy do frontend disparado"
